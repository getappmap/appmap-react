name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `deno` is needed by examples/petclinic-react/test/e2e/deno-fullstack.test.ts,
      # which otherwise skips itself. Installing it here makes the Deno half of
      # the full-stack e2e test run on every PR instead of being silently skipped.
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Deno resolves the recorder's npm deps (e.g. npm:@types/node during
      # type-checking) from node_modules, so install them first.
      - run: npm ci
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      # deno/test contains Vitest-hosted unit tests; native Deno smoke tests
      # live in deno/appmap_test.ts.
      - run: deno test -A --unstable-sloppy-imports deno/appmap_test.ts
